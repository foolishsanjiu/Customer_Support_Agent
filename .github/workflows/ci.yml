name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: resolvex
          MYSQL_USER: resolvex
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.4.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: mysql+asyncmy://resolvex:ci-password@127.0.0.1:3306/resolvex
      LANGGRAPH_REDIS_URL: redis://127.0.0.1:6379/1
      CONTROL_REDIS_URL: redis://127.0.0.1:6379/2
      RUN_INTEGRATION_TESTS: "1"
      SECURITY_EVAL_REPORT: artifacts/security-evaluation.json
      SECURITY_EVAL_OBSERVATIONS: artifacts/security-observations.json

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: resolvex
          auto-activate-base: false
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: |
          mkdir -p artifacts
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-fail-under=90 \
            --junitxml=artifacts/pytest.xml
      - name: Upload test and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolvex-ci-reports-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

name: resolvex

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-ResolveX}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      SERVICE_NAME: resolvex-api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
      LANGGRAPH_REDIS_URL: redis://redis:6379/0
      CONTROL_REDIS_URL: redis://redis:6379/2
      CHROMA_PATH: /data/chroma
      POLICY_DIRECTORY: /app/policies
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_CACHE_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOGISTICS_MCP_URL: http://mcp-logistics:8001/mcp
      FULFILLMENT_MCP_URL: http://mcp-fulfillment:8002/mcp
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-resolvex}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-resolvex-api}
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-60}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-logistics:
        condition: service_healthy
      mcp-fulfillment:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - chroma-data:/data/chroma
      - "${BGE_MODEL_CACHE_HOST:-D:/CondaEnvs/resolvex/models}:/models:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command:
      - celery
      - -A
      - app.worker.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    environment: &worker-environment
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: resolvex-worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
      LANGGRAPH_REDIS_URL: redis://redis:6379/0
      CONTROL_REDIS_URL: redis://redis:6379/2
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      MAX_RECOVERY_ATTEMPTS: ${MAX_RECOVERY_ATTEMPTS:-3}
      EXTERNAL_CIRCUIT_FAILURE_THRESHOLD: ${EXTERNAL_CIRCUIT_FAILURE_THRESHOLD:-3}
      EXTERNAL_CIRCUIT_RECOVERY_SECONDS: ${EXTERNAL_CIRCUIT_RECOVERY_SECONDS:-30}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-1440}
      CHROMA_PATH: /data/chroma
      POLICY_DIRECTORY: /app/policies
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_CACHE_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOGISTICS_MCP_URL: http://mcp-logistics:8001/mcp
      FULFILLMENT_MCP_URL: http://mcp-fulfillment:8002/mcp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-logistics:
        condition: service_healthy
      mcp-fulfillment:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - chroma-data:/data/chroma
      - "${BGE_MODEL_CACHE_HOST:-D:/CondaEnvs/resolvex/models}:/models:ro"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *worker-environment
      SERVICE_NAME: resolvex-scheduler
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  mcp-logistics:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.mcp.logistics_server"]
    environment:
      SERVICE_NAME: resolvex-mcp-logistics
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8001), 2).close()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mcp-fulfillment:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.mcp.fulfillment_server"]
    environment:
      SERVICE_NAME: resolvex-mcp-fulfillment
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8002), 2).close()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-resolvex-local-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.4.4
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:

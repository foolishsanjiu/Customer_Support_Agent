name: resolvex

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-ResolveX}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      SERVICE_NAME: resolvex-api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
      LANGGRAPH_REDIS_URL: redis://redis:6379/0
      CONTROL_REDIS_URL: redis://redis:6379/2
      CHROMA_PATH: /data/chroma
      POLICY_DIRECTORY: /app/policies
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_CACHE_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOGISTICS_MCP_URL: http://mcp-logistics:8001/mcp
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-resolvex}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-resolvex-api}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-logistics:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - chroma-data:/data/chroma
      - "${BGE_MODEL_CACHE_HOST:-D:/CondaEnvs/resolvex/models}:/models:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command:
      - celery
      - -A
      - app.worker.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    environment: &worker-environment
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: resolvex-worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
      LANGGRAPH_REDIS_URL: redis://redis:6379/0
      CONTROL_REDIS_URL: redis://redis:6379/2
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      MAX_RECOVERY_ATTEMPTS: ${MAX_RECOVERY_ATTEMPTS:-3}
      APPROVAL_TTL_MINUTES: ${APPROVAL_TTL_MINUTES:-1440}
      CHROMA_PATH: /data/chroma
      POLICY_DIRECTORY: /app/policies
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_CACHE_DIR: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LOGISTICS_MCP_URL: http://mcp-logistics:8001/mcp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-logistics:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - chroma-data:/data/chroma
      - "${BGE_MODEL_CACHE_HOST:-D:/CondaEnvs/resolvex/models}:/models:ro"
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=info"]
    environment:
      <<: *worker-environment
      SERVICE_NAME: resolvex-scheduler
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  mcp-logistics:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.mcp.logistics_server"]
    environment:
      SERVICE_NAME: resolvex-mcp-logistics
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 8001), 2).close()
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.4.4
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  chroma-data:
